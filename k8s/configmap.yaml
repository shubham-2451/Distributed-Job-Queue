apiVersion: v1
kind: ConfigMap
metadata:
  name: dtq-config
  labels:
    app.kubernetes.io/name: distributed-task-queue
    app.kubernetes.io/part-of: distributed-task-queue
data:
  REDIS_URL: "redis://redis:6379/0"
  LOG_LEVEL: "INFO"
  WORKER_CONCURRENCY: "4"
  WORKER_LEASE_TIMEOUT_SECONDS: "30"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "10"
  RECENT_JOBS_LIMIT: "100"
  EVENT_STREAM_LIMIT: "200"

